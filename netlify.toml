[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# SPA fallback (not needed for SSG, but kept for safety)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

# Mailchimp archive redirect
[[redirects]]
  from = "/archive"
  to = "/community/newsletter"
  status = 301
